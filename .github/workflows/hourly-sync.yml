name: Hourly Strava Sync

# Ticket 05: Vercel's Hobby plan only permits daily-or-less-frequent cron
# jobs, so the hourly schedule that keeps the dashboard's data fresh lives
# here instead, calling the deployed app's protected /api/sync route (ticket
# 04) over HTTPS.

on:
  schedule:
    # Every hour, on the hour. GitHub Actions schedules run on a best-effort
    # basis and can be delayed under load — that's fine for this use case.
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  SITE_URL: https://strava-visualiser.vercel.app

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected sync endpoint
        run: |
          http_status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/sync" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}")

          echo "HTTP status: ${http_status}"
          echo "Response body:"
          cat response.json

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "Sync request failed with status ${http_status}"
            exit 1
          fi
